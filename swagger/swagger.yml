paths:
  /plantilla/renderizar:
    post:
      tags:
      - plantilla
      description: Genera un PDF (base64) utilizando un ID de plantilla y datos personalizados para su reemplazo
      operationId: RenderizadoController.Renderizar
      parameters:
      - in: body
        name: body
        description: body for Renderizado content
        required: true
        schema:
          $ref: '#/definitions/models.Renderizado'
      responses:
        "201":
          description: '{int} models.Rol'
        "400":
          description: body is empty
  /plantilla/renderizar-docx:
    post:
      tags:
      - plantilla
      description: Genera un DOCX (base64) a partir de contenido HTML y datos personalizados para su reemplazo
      operationId: RenderizadoDOCXController.RenderizarDOCX
      parameters:
      - in: body
        name: body
        description: body for RenderizadoDOCX content
        required: true
        schema:
          $ref: '#/definitions/models.RenderizadoDOCX'
      responses:
        "201":
          description: '{int} models.Rol'
        "400":
          description: body is empty
  /plantilla/renderizar-html:
    post:
      tags:
      - plantilla
      description: Genera un HTML utilizando un ID de plantilla y datos personalizados para su reemplazo
      operationId: RenderizadoHTMLController.RenderizarHTML
      parameters:
